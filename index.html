<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tstatus.de | Ternis Statuspage - Coming Soon</title>
  <meta name="description" content="tstatus.de - Ternis Statuspage. Real-time service status and uptime monitoring coming soon.">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-glow: rgba(59, 130, 246, 0.15);
      --status-emerald: #10b981;
      --status-emerald-glow: rgba(16, 185, 129, 0.25);
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 1.5rem;
    }

    /* Ambient background lighting */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 640px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      transition: border-color 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--status-emerald);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.375rem 0.875rem;
      border-radius: 9999px;
      margin-bottom: 1.75rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--status-emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--status-emerald);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    .domain-title {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #6b7280;
      margin-bottom: 2rem;
    }

    .status-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1.fr));
      gap: 0.75rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.8125rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-item-label {
      font-weight: 500;
      color: var(--text-main);
    }

    .status-item-tag {
      font-size: 0.75rem;
      color: #6b7280;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.8125rem;
      color: #4b5563;
    }

    footer a {
      color: #6b7280;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="card">
      <div class="badge">
        <span class="pulse-dot"></span>
        <span>Coming Soon</span>
      </div>

      <h1 class="domain-title">tstatus.de</h1>
      <p class="subtitle">Ternis Statuspage</p>

      <p class="description">
        We are building a centralized real-time status and incident communication hub for all Ternis services and infrastructure.
      </p>

      <div class="status-preview-grid">
        <div class="status-item">
          <span class="status-item-label">Status Hub</span>
          <span class="status-item-tag">In Setup</span>
        </div>
        <div class="status-item">
          <span class="status-item-label">Monitoring</span>
          <span class="status-item-tag">Configuring</span>
        </div>
        <div class="status-item">
          <span class="status-item-label">Incident Mgmt</span>
          <span class="status-item-tag">Planned</span>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Ternis EDV &bull; <a href="https://tstatus.de">tstatus.de</a></p>
    </footer>
  </div>
</body>
</html>
